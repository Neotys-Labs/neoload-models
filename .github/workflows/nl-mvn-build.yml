name: Neoload CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - v3
  workflow_dispatch:
    inputs:
      release:
        required: false
        type: boolean
        default: false
      skip-tests:
        required: false
        type: boolean
        default: false

run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.release && '🚀 Release Build' || '🔧 Dev Build') || '' }}"

jobs:
  build:
    name: Backend
    uses: tricentis-neoload/templates/.github/workflows/nl-mvn-build-public.yml@feature/DEVEX-2816-neotyslabs
    with:
      skip-tests: ${{ fromJSON(github.event.inputs.skip-tests || 'false') }}
      release: ${{ fromJSON(github.event.inputs.release || 'false') }}
    secrets:
      RUNNER_FULL_TAG: ${{ secrets.RUNNER_FULL_TAG }}
      CLOUDSMITH_OIDC_NAMESPACE: ${{ secrets.CLOUDSMITH_OIDC_NAMESPACE }}
      CLOUDSMITH_OIDC_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_OIDC_SERVICE_SLUG }}
      MVN_NEXUS_PUBLIC_USERNAME: ${{ secrets.MVN_NEXUS_PUBLIC_USERNAME }}
      MVN_NEXUS_PUBLIC_PASSWORD: ${{ secrets.MVN_NEXUS_PUBLIC_PASSWORD }}
      MVN_OSSRH_USERNAME: ${{ secrets.MVN_OSSRH_USERNAME }}
      MVN_OSSRH_PASSWORD: ${{ secrets.MVN_OSSRH_PASSWORD }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_APP_NEOLOAD_PUBLISHER_CLIENT_ID: ${{ secrets.GH_APP_NEOLOAD_PUBLISHER_CLIENT_ID }}
      GH_APP_NEOLOAD_CI_REPORTER_PRIVATE_KEY: ${{ secrets.GH_APP_NEOLOAD_CI_REPORTER_PRIVATE_KEY }}
