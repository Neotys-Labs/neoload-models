name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - request:
        name: request
        url: http://www.neotys.com/select?name:neoload
        assertions:
        - content:
            name: assertion_1
            not: true
            contains: Design & Maintenance
            regexp: true
        - content:
            name: assertion_2
            xpath: xpath
            not: true
            contains: Analyze
            regexp: true
        - content:
            name: assertion_3
            jsonpath: jsonpath
            not: true
            contains: DevOps and Automation
            regexp: true
