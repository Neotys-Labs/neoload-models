name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - websocket_channel:
        name: chat_socket
        url: wss://host:443/chat
        push_messages:
        - name: on_ping
          conditions:
          - "'${NL-MessageContent}' contains 'ping'"
          steps:
          - websocket_request:
              channel: actions>chat_socket
              body: pong
        - name: on_order_update
          description: an order status pushed by the server
          conditions:
          - "'${NL-MessageContent}' contains 'order'"
          - "'${NL-MessageContent}' contains 'status'"
          match: all
          charset: UTF-8
          extractors:
          - name: order_id
            jsonpath: $.order.id
          assertions:
          - contains: status
          steps:
          - transaction:
              name: Order
              steps:
              - request:
                  url: "https://host/orders/${order_id}"
        - name: on_heartbeat
          conditions:
          - "'${NL-MessageContent}' == 'hb'"
        - name: anything_else
          steps:
          - websocket_request:
              channel: actions>chat_socket
              body: unknown message
