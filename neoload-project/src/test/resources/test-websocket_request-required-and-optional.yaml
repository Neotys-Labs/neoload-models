name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - websocket_channel:
        name: chat_socket
        url: https://host:443/chat
        messages_mapping:
          jsonpath: $.correlationId
    - websocket_request:
        name: send_hello
        description: a synchronous request using every setting
        channel: actions>chat_socket
        synchronous: true
        mapping_id: 444-555-1234
        body: hello
        extractors:
        - name: session_id
          regexp: "session=([0-9]+)"
        assertions:
        - contains: welcome
