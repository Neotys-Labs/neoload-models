name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - websocket_channel:
        name: my_channel
        url: https://host:443/socket
    - websocket_request:
        name: send_binary
        channel: actions>my_channel
        message_type: binary
        bodybinary: AAEC//4=
    - websocket_request:
        name: close_channel
        channel: actions>my_channel
        message_type: close
        status_code: 1001
        body: going away
