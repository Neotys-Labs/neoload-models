schemaVersion: "3.2"
name: MyProject
web_services_security:
  request_profiles:
  - name: SignVar
    headers:
    - tokens:
      - signature:
          keystore: ./wss-keystores/../../x/${env}.p12
          alias: client
      - encryption:
          keystore: ./wss-keystores/${env}/../../x.p12
          alias: server
