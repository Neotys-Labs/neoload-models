name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - delay:
        name: MyConstantDelay1
        description: MyConstantDelay1Description
        value: 1h 3m 10s 200ms
    - delay:
        name: MyConstantDelay2
        description: MyConstantDelay2Description
        value: "${delay}"
    - delay:
        name: MyRandomDelay1
        description: MyRandomDelay1Description
        min: 1h 3m 10s 100ms
        max: 1h 3m 10s 200ms
    - delay:
        name: MyRandomDelay2
        description: MyRandomDelay2Description
        min: "${min_delay}"
        max: "${max_delay}"
