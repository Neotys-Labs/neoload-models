name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - websocket_channel:
        name: full_channel
        description: a channel using every setting
        url: /socket
        server: myserver
        headers:
        - Origin: https://host
        extractors:
        - name: session_id
          regexp: "session=([0-9]+)"
        content_assertions:
        - contains: 101 Switching Protocols
        duration_assertion:
          less_than: 2000
        size_assertion:
          less_than: 4096
        messages_mapping:
          jsonpath: $.correlationId
        timestamp_extractor:
          regexp: ts=(\d+)
