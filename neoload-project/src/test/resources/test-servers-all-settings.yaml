schemaVersion: 3.2
name: MyProject
servers:
- name: backend
  host: backend.example.com
  scheme: https
  port: 8443
  authentications:
  - login: "${user}"
    password: "${password}"
    realm: CORP
    preferred_protocol: kerberos
  - login: admin
    password: secret
    preferred_protocol: ntlm
  url_rewriting:
    session_argument: jsessionid
    in_path: true
    path_separator: /
    equals_sign: false
- name: shop
  host: shop.example.com
  url_rewriting:
    session_argument: phpsessid
- name: media
  type: tcp
  host: media.example.com
  port: 65535
