name: MyProject
scenarios:
- name: MyScenario
  populations:
  - name: MyPopulation1
    constant_load:
      users: 500
  - name: MyPopulation2
    rampup_load:
      min_users: 1
      increment_users: 10
      increment_every: 5s
  - name: MyPopulation3
    peaks_load:
      minimum:
        users: 100
        duration: 2m
      maximum:
        users: 500
        duration: 2m
      start: minimum
  - name: MyPopulation4
    custom_load:
      steps:
      - when: 1m40s
        users: 300
