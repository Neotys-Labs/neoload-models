name: MyProject
web_services_security:
  keystores:
  - path: ./wss-keystores/server.p12
    password: secret
  request_profiles:
  - name: MyRequestProfile
    headers:
    - actor: http://example.com/actor
      must_understand: true
      tokens:
      - username:
          username: user
          password: secret
          password_type: plain_text
          nonce: true
          created: true
      - timestamp:
          id: TS-1
          time_to_live: 600
          milliseconds: false
  response_profiles:
  - name: MyResponseProfile
    keystore: ./wss-keystores/server.p12
