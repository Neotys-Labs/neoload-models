name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - request:
        name: request
        url: http://www.neotys.com/select?name:neoload
        assertions:
        - content:
            contains: DevOps and Automation
        - content:
            xpath: xpath
            contains: DevOps
        - content:
            jsonpath: jsonpath
            contains: Automation
