name: MyProject
web_services_security:
  keystores:
  - path: ./wss-keystores/client.p12
  request_profiles:
  - name: MyRequestProfile
    headers:
    - tokens:
      - signature:
          keystore: ./wss-keystores/client.p12
          alias: "${alias}"
          key_identifier_type: direct_reference_first_certificate
          signature_algorithm: rsa_sha256
          digest_algorithm: sha256
          canonicalization_algorithm: canonical_xml_with_comments
          parts:
          - id: Body-1
      - encrypt:
          keystore: ./wss-keystores/client.p12
          alias: server
          key_identifier_type: x509_key_identifier
          symmetric_encryption_algorithm: aes_256
          asymmetric_encryption_algorithm: rsa_oaep
          parts:
          - name: Body
            namespace: http://schemas.xmlsoap.org/soap/envelope/
            encoding: content
