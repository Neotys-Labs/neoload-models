name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - request:
        name: request_size_equals
        url: http://www.neotys.com/download
        size_assertion:
          equals: 1024
    - request:
        name: request_size_range
        url: http://www.neotys.com/download
        size_assertion:
          greater_than: 1024
          less_than: 2048
    - request:
        name: request_size_single_bound
        url: http://www.neotys.com/download
        size_assertion:
          greater_than: 1024
    - custom_action:
        name: sql action
        type: SQL
        size_assertion:
          less_than: 2048
