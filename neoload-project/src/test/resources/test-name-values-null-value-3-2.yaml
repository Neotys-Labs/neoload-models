schemaVersion: "3.2"
name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - request:
        url: http://www.neotys.com/select
        headers:
        - name: X-Empty
          value:
        - X-Empty-Map:
    - soap_request:
        url: http://host:80/
        headers:
        - SOAPAction:
        parameters:
        - name: MyParameter
          value:
        content:
          path: ./requests/mySOAPRequest.xml
