name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - custom_action:
        name: sql action
        description: This is a SQL action
        type: SQL
        parameters:
        - name: connectionURL
          value: jdbc:mysql://localhost:3306/
        - name: connection.password
          value: myPassword
          type: PASSWORD
        asRequest: true
        libraryPath: file:///C:/path/to/library
