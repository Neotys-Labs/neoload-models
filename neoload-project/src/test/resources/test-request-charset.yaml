name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - request:
        url: http://www.neotys.com/select
        method: POST
        body: My Body
        charset: UTF-8
    - request:
        url: http://www.neotys.com/select
        method: PUT
        body: My Body
        charset: UTF-8
    - soap_request:
        url: http://host:80/
        content:
          path: ./requests/mySOAPRequest.xml
        charset: UTF-8
