name: MyProject
variables:
- constant:
    name: constant_variable
    value: 118218
- file:
    name: cities_file
    description: cities variable file description
    column_names:
    - City
    - Country
    - Population
    - Longitude
    - Latitude
    is_first_line_column_names: false
    start_from_line: 5
    delimiter: ;
    path: data/list_of_cities.csv
    change_policy: each_user
    scope: unique
    order: sequential
    out_of_value: stop_test
- file:
    name: cities2_file
    description: cities2 variable file description
    is_first_line_column_names: true
    start_from_line: 1
    delimiter: ;
    path: data/list_of_cities.csv
    change_policy: each_page
    scope: local
    order: random
    out_of_value: no_value_code
- counter:
    name: My Counter
    start: 0
    end: 1
    increment: 10
    scope: local
- random_number:
      name: MyRandomNumber
      min: 9999
      max: -1
      predictable: false
      change_policy: each_request
- date:
      name: MyDate
      pattern: "yyyy-MM-dd"
      start_date: "2026-01-01"
      inc_type: day
      inc_value: 1
      change_policy: each_iteration
- current_date:
      name: MyMinimalCurrentDate
      pattern: "yyyy-MM-dd"
- current_date:
      name: MyFullCurrentDate
      description: now plus 5 minutes
      pattern: "yyyy-MM-dd'T'HH:mm:ss"
      inc_type: minute
      inc_value: 5
      change_policy: each_use
- javascript:
    name: My JSVar
    description: This is a js var
    script: "function evaluate() {\n\tlogger.debug(\"Computing value of js variable\"\
      );\n\treturn new function() {\n\t\tthis.firstField = \"a value\";\n\t\tthis.secondField\
      \ = myLibraryFunction();\n\t};\n}"
