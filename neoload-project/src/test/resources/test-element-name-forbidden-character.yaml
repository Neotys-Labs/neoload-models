name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - transaction:
        name: bad#name
        steps:
        - switch:
            value: "${MySwitchVariable}"
            case:
            - value: "#1 | $100"
              break: true
              steps:
              - delay: 1s
            default:
              steps:
              - delay: 3s
