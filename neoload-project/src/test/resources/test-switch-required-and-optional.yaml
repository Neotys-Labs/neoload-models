name: MyProject
user_paths:
- name: MyUserPath
  actions:
    steps:
    - switch:
        name: MySwitch
        description: MySwitchDescription
        value: "${MySwitchVariable}"
        case:
        - value: 0
          break: true
          steps:
          - delay: 1s
        - description: MyCase1Description
          value: 1
          break: false
          steps:
          - delay: 1s
          assertions:
          - contains: MyCase1Assertion on Content
        default:
          steps:
          - delay: 3s
